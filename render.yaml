# render.yaml — Render.com blueprint for the multirate API.
#
# `region` should match the Supabase project region so the pooler hop
# stays intra-datacentre. Valid Render values: oregon, ohio, virginia,
# frankfurt, singapore.

services:
  - type: web
    name: multirate-api
    env: docker
    region: virginia
    plan: starter
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      # No SUPABASE_JWT_SECRET: tokens are verified via the
      # project's public JWKS (ES256), fetched at boot.
      - key: CORS_ORIGIN
        sync: false
